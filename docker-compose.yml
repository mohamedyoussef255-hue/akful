version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. POSTGRESQL 14 (Database Layer with persistent volumes & healthcheck)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:14-alpine
    container_name: ekfel_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ekfel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekfel_secure_vault_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ekfel_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ekfel_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekfel_admin} -d ${POSTGRES_DB:-ekfel_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. NODE.JS CORE BACKEND (Express + TypeScript + Socket.io + Gemini SDK)
  # ---------------------------------------------------------------------------
  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekfel_core_service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ekfel_admin}:${POSTGRES_PASSWORD:-ekfel_secure_vault_2026}@postgres:5432/${POSTGRES_DB:-ekfel_production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-ekfel_jwt_super_secret_signing_key_2026}
      SUPER_ADMIN_EMAIL: "mohamedyoussef255@gmail.com"
      SUPER_ADMIN_PASS: "mohamed2072"
      APP_URL: ${APP_URL:-https://ekfel.app}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ekfel_internal_net
    expose:
      - "3000"

  # ---------------------------------------------------------------------------
  # 3. NGINX SECURE REVERSE PROXY (TLSv1.3 Hardened + WebSockets /socket.io/)
  # ---------------------------------------------------------------------------
  nginx_secure_proxy:
    image: nginx:alpine
    container_name: ekfel_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend_api
    networks:
      - ekfel_internal_net

networks:
  ekfel_internal_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
