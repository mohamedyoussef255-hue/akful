# ============================================================================
# EKFEL (أكفَل) — DevSecOps Hardened Nginx Reverse Proxy Configuration
# Enforces HTTP -> HTTPS 301 Redirect, TLSv1.3 only, and WebSocket Proxying
# ============================================================================

upstream backend_upstream {
    server backend_api:3000;
    keepalive 32;
}

# ----------------------------------------------------------------------------
# 1. Port 80: Permanent Re-route to Port 443 (Strict HTTPS)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ekfel.app www.ekfel.app localhost;

    # Redirect all HTTP requests to HTTPS with 301 Moved Permanently
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# 2. Port 443: Hardened TLSv1.3 Reverse Proxy
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ekfel.app www.ekfel.app localhost;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Strict TLSv1.3 constraints
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Enterprise DevSecOps Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' wss: https:;" always;

    # Client payload size (accommodating base64 transfer receipt images)
    client_max_body_size 25M;

    # ------------------------------------------------------------------------
    # API & General Endpoints Reverse Proxy
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------------
    # WebSockets Data Packets Routing (/socket.io/)
    # ------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Real-time WebSocket timeout resilience
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ------------------------------------------------------------------------
    # Frontend SPA Web Application Routing
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
